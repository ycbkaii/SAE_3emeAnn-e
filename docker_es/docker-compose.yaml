services:

  elasticsearch:
    image: bitnami/elasticsearch:8.17.1
    container_name: my-es-sae
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms4096m -Xmx4096m # Pour pas que ES prennent TOUTES la ram
    volumes:
      - elasticsearch-data-persistence:/bitnami/elasticsearch/data
    networks:
      - es  

