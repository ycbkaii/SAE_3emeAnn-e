<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="scrolled">
        <span class="primary-menu--logo"><a href="/"></a></span>
        <ul class="primary-menu--list">
            <li class="primary-menu--item"><a href="/">Home</a></li>
            <li class="primary-menu--item"><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <main class="book-container">
        <h1 id="book-title" class="book-title"></h1>
        <div class="book-info">
            <div class="book-details">
                <p><strong>Description:</strong> <span id="book-description"></span></p>
                <p><strong>Genres:</strong>
                <ul id="book-genres"></ul>
                </p>
                <p><strong>Rating:</strong> <span id="book-rating"></span> <span id="star-rating"></span></p>
                <p><strong>Number of Votes:</strong> <span id="book-rating-count"></span></p>
            </div>
            <div class="book-cover">
                <img id="book-cover-img" src="" alt="Book Cover">
            </div>
        </div>
        <div class="book-extra">
            <p><strong>Characters:</strong> <span id="book-characters"></span></p>
            <p><strong>Publishers:</strong> <span id="book-publishers"></span></p>
            <p><strong>Pages:</strong> <span id="book-pages"></span></p>
            <p><strong>Saga:</strong> <span id="book-saga"></span></p>
            <p><strong>Volume Number:</strong> <span id="book-opus"></span></p>
            <p><strong>Awards:</strong> <span id="book-awards"></span></p>
            <p><strong>ISBN:</strong> <span id="book-isbn"></span></p>
            <p><strong>Number of Reviews:</strong> <span id="book-review-count"></span></p>
        </div>


        <section id="section_saga" class="section__category" style="display: none;">
                <h3 class="category--title"><a href="#">De la même saga :</a></h3>
                <div class="category--carousel">
                    <span class="carousel-button prev" role="button" aria-label="See previous titles"><b class="fa-solid fa-chevron-left"></b></span>
                    <div class="carousel__container">
                        <ul class="carousel--list">
                        </ul>
                    </div>
                    <span class="carousel-button next" role="button" aria-label="See more titles"><b class="fa-solid fa-chevron-right"></b></span>
                </div>
            </section>
            <section id="section_algo" class="section__category">
                <h3 class="category--title"><a href="#">Vous pourriez aimer aussi :</a></h3>
                <div class="category--carousel">
                    <span class="carousel-button prev" role="button" aria-label="See previous titles"><b class="fa-solid fa-chevron-left"></b></span>
                    <div class="carousel__container">
                        <ul class="carousel--list">
                            <li style="position: absolute;" class="carousel--item"><a href="#"><img src="" alt=""></a></li>

                        </ul>
                    </div>
                    <span class="carousel-button next" role="button" aria-label="See more titles"><b class="fa-solid fa-chevron-right"></b></span>
                </div>
            </section>
    </main>

    <script>

        function addCarouselItem(containerSelector, href, src, alt, label="") {
        const container = document.querySelector(`${containerSelector} .carousel--list`);
        titre = document.querySelector(`${containerSelector}`).getElementsByClassName("category--title")[0];
        titre.innerHTML = label;
        if (!container) return;
        
        const listItem = document.createElement('li');
        listItem.classList.add('carousel--item');
        
        const link = document.createElement('a');
        link.href = href;
        
        const image = document.createElement('img');
        image.src = src;
        image.alt = alt;
        
        link.appendChild(image);
        listItem.appendChild(link);
        container.appendChild(listItem);
        }


        function setTextContent(id, value) {
            document.getElementById(id).innerText = value ? value : "Not provided";
        }

        async function fetchBook() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('book_id');
            if (!bookId) {
                setTextContent('book-title', "No book ID provided.");
                return;
            }

            try {
                const response = await fetch(`/books_infos_all_list/${bookId}`);
                if (!response.ok) {
                    throw new Error("Error retrieving data");
                }
                const bookData = await response.json();
                const book = bookData[0][0];

                setTextContent('book-title', book[1]);
                document.getElementById('book-cover-img').src = book[10] || "placeholder.jpg";
                setTextContent('book-isbn', book[4]);
                setTextContent('book-rating', book[9]);

                let starsHtml = '★'.repeat(Math.floor(book[9])) + '☆'.repeat(5 - Math.floor(book[9]));
                document.getElementById('star-rating').innerHTML = starsHtml;

                setTextContent('book-description', book[2]);
                setTextContent('book-pages', book[3]);
                setTextContent('book-saga', book[5]);
                setTextContent('book-opus', book[6]);
                setTextContent('book-review-count', book[7]);
                setTextContent('book-rating-count', book[8]);
                setTextContent('book-characters', book[12]);
                setTextContent('book-publishers', book[14]);
                setTextContent('book-awards', book[13]);
                saga_Name = book[5];
            } catch (error) {
                setTextContent('book-title', "Error: " + error.message);
            }

            try {
                const response = await fetch(`/books_infos_list/${bookId}`);
                if (!response.ok) {
                    throw new Error("Error retrieving data");
                }
                const genres = await response.json();
                const genresContainer = document.getElementById('book-genres');
                genresContainer.innerHTML = "";
                const ul = document.createElement('ul');
                genres.forEach(genre => {
                    const li = document.createElement('li');
                    li.textContent = genre;
                    ul.appendChild(li);
                });
                genresContainer.appendChild(ul);
            } catch (error) {
                setTextContent('book-info', "Error: " + error.message);
            }

            try {
                if (saga_Name != null) {
                    
                    const response = await fetch(`/books_saga/${encodeURIComponent(saga_Name)}`);
                    if (!response.ok) {
                        throw new Error("Error retrieving data");
                    }
                    const books_saga = await response.json();

                    if (books_saga != []) 
                    {
                        document.getElementById("section_saga").style.display = "block"
                    for (let index = 0; index < books_saga.length; index++) {
                        const element = books_saga[index];
                        let url_image = element[4];
                        console.log(element);
                        addCarouselItem("#section_saga", "/book?book_id="+element[5], url_image, element[0], "");
                    }                
                }
            }
    
            } catch (error) {
                console.log('book-info', "Error: " + error.message);
            }
            try {
                if (bookId) {
                    const response = await fetch(`/livres/similaire/${encodeURIComponent(bookId)}`);
                        if (!response.ok) {
                            throw new Error("Error retrieving data");
                        }
                        const books_reco = await response.json();

                        if (books_reco != []) 
                        {
                        for (let index = 0; index < books_reco.length; index++) {
                            const element = books_reco[index];
                            let url_image = element[4];
                            console.log(element);
                            addCarouselItem("#section_algo", "/book?book_id="+element[5], url_image, element[0], "");
                        }                
                    }
                }
            } catch (error) {
                console.log(error);
            }
        }

        window.onload = fetchBook;
    </script>
</body>
</html>
