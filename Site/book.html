<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requête GET - Livre</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <script>
        function displayBarreRecherche() {
            let barre = document.getElementById("searchbartop");
            if (barre.style.visibility == "hidden" || barre.style.visibility == "") {
                barre.style.visibility = "visible";
                barre.className = "overlay effet";
            } else {
                barre.style.visibility = "hidden";
                barre.className = "overlay";
            }
        }
    </script>

    <nav role="navigation" class="scrolled">
        <span class="primary-menu--logo"><a href="/"></a></span>
        <ul class="primary-menu--list">
            <li class="primary-menu--item"><a href="/">Home</a></li>
            <li class="primary-menu--item"><a href="/contact">Contact</a></li>
        </ul>
        <ul class="secondary-menu--list">
            <li class="secondary-menu--item">
                <a onclick="displayBarreRecherche()" id="loupe"><i class="fa-solid fa-search"></i></a>
                <div class="overlay" id="searchbartop">
                    <div class="search-popup">
                        <button class="close-btn" onclick="displayBarreRecherche()">✖</button>
                        <form method="post" action="">
                            <input type="text" placeholder="Rechercher un livre, une série, un auteur..." />
                            <button type="submit">🔎</button>
                        </form>
                    </div>
                </div>
            </li>
            <li class="secondary-menu--item"><a href="#"><i class="fa-solid fa-bell"></i></a></li>
            <li class="secondary-menu--item user">
                <span class="secondary-menu--user-icon"><a href="#"></a></span>
                <a href="#"><i class="fa-solid fa-caret-down"></i></a>
            </li>
        </ul>
    </nav>

    <main class="hero">
        <div>
            <h1 id="book-title"></h1>
            <p><strong>Description :</strong> <span id="book-description"></span></p>
            <p><strong>Genres :</strong><ul id="book-genres"></ul></p>
    
            <p><strong>Note :</strong> <span id="book-rating"></span> <span id="star-rating"></span></p>
            <p><strong>Personnages :</strong> <span id="book-characters"></span></p>
            <p><strong>Éditeurs :</strong> <span id="book-publishers"></span></p>
            <p><strong>Pages :</strong> <span id="book-pages"></span></p>
            <p><strong>Saga :</strong> <span id="book-saga"></span></p>
            <p><strong>Numéro de l'Opus :</strong> <span id="book-opus"></span></p>
            <p><strong>Récompenses :</strong> <span id="book-awards"></span></p>
            <p><strong>ISBN :</strong> <span id="book-isbn"></span></p>
            <p><strong>Nombre de Revues :</strong> <span id="book-review-count"></span></p>
            <p><strong>Nombre de Votes :</strong> <span id="book-rating-count"></span></p>
    
        </div>

        <img id="book-cover" src="" alt="Couverture du livre">
    </main>

    <script>
        async function fetchBook() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('book_id');
            if (!bookId) {
                document.getElementById('book-title').innerText = "Aucun ID de livre fourni.";
                return;
            }

            try {
                // Fetch book details by ID
                const response = await fetch(`/books_infos_all_list/${bookId}`);
                if (!response.ok) {
                    throw new Error("Erreur lors de la récupération des données");
                }

                const bookData = await response.json();
                const book = bookData[0][0]; // Get first book from the response

                document.getElementById('book-title').innerText = book[1];
                document.getElementById('book-cover').src = book[10];
                document.getElementById('book-isbn').innerText = book[4];
                document.getElementById('book-rating').innerText = book[9];
                
                // Display stars
                let rating = book[9];
                let fullStars = Math.floor(rating);
                let emptyStars = 5 - fullStars;
                let starsHtml = '';
                for (let i = 0; i < fullStars; i++) {
                    starsHtml += '★';
                }
                for (let i = 0; i < emptyStars; i++) {
                    starsHtml += '☆';
                }
                document.getElementById('star-rating').innerHTML = starsHtml;

                // Display other information
                document.getElementById('book-characters').innerText = book[12];
                document.getElementById('book-awards').innerText = book[13];
                document.getElementById('book-publishers').innerText = book[14];
                document.getElementById('book-pages').innerText = book[3];
                document.getElementById('book-saga').innerText = book[5];
                document.getElementById('book-opus').innerText = book[6];
                document.getElementById('book-description').innerText = book[2];
                document.getElementById('book-review-count').innerText = book[7];
                document.getElementById('book-rating-count').innerText = book[8];
                
            } catch (error) {
                document.getElementById('book-title').innerText = "Erreur : " + error.message;
            }
        }

        window.onload = fetchBook;
    </script>
</body>

</html>
